---
# Write the forward hop's tokens as 0600 files for Vector's directory secret
# backend (NAN-3397): one file per source in _nano_ingest_tokens (yours, or issued
# by ingest_tokens.yml on open-core). Stale files are removed.
# Input: _aggregator_secrets_dir.
- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ _aggregator_secrets_dir }}"
    state: directory
    mode: "0700"

- name: Assemble the token files
  ansible.builtin.set_fact:
    _aggregator_secret_files: >-
      {{ _nano_ingest_tokens | default(nano_ingest_source_tokens) }}
  no_log: true

- name: Write the token files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ _aggregator_secrets_dir }}/{{ item.key }}"
    mode: "0600"
  loop: "{{ _aggregator_secret_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  register: _aggregator_secret_writes

- name: Find token files no longer configured
  ansible.builtin.find:
    paths: "{{ _aggregator_secrets_dir }}"
    file_type: file
  register: _aggregator_secret_existing

- name: Remove token files no longer configured
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _aggregator_secret_existing.files | rejectattr('path', 'in', _aggregator_secret_files.keys() | map('regex_replace', '^', _aggregator_secrets_dir ~ '/') | list) | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: _aggregator_secret_removals
