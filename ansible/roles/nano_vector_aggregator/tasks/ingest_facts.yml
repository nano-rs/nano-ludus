---
# Validate the forward-hop settings and derive the facts the config template
# reads (NAN-3397). Split out so tests/render.yml can render the template with
# exactly the role's own logic.
- name: Validate nano_ingest_mode
  ansible.builtin.assert:
    that:
      - nano_ingest_mode in ['hec', 'vector']
    fail_msg: "nano_ingest_mode must be 'hec' or 'vector' (got: {{ nano_ingest_mode }})"
    quiet: true

- name: Validate vector-mode target
  ansible.builtin.assert:
    that:
      - nanosiem_siem_ip | length > 0
    fail_msg: "nano_ingest_mode=vector needs nanosiem_siem_ip (the open-core install's :6000)"
    quiet: true
  when: nano_ingest_mode == 'vector'

- name: Derive the HEC endpoint
  ansible.builtin.set_fact:
    _nano_ingest_url: >-
      {{ (nano_ingest_url | length > 0) | ternary(nano_ingest_url,
          'http://' ~ nanosiem_siem_ip ~ ':8088') | regex_replace('/+$', '') }}
  when: nano_ingest_mode == 'hec'

# The tokens the sinks use: the operator's per-source tokens, plus (open-core)
# the ones ingest_tokens.yml issues. A fact of its own, so it works however
# nano_ingest_source_tokens was passed (host var, role param, extra var).
- name: Start from the operator's per-source tokens
  ansible.builtin.set_fact:
    _nano_ingest_tokens: "{{ nano_ingest_source_tokens }}"
  no_log: true

- name: Derive the forwarded sources
  ansible.builtin.set_fact:
    _nano_ingest_sources: "{{ (nano_ingest_sources + (nano_ingest_source_tokens.keys() | list)) | unique | sort }}"
  when: nano_ingest_mode == 'hec'

# NAN-3841: on an open-core nano the role issues one token per source itself
# (ingest_tokens.yml) when it can reach the nano API with admin credentials.
- name: Derive the token-provisioning API
  ansible.builtin.set_fact:
    _nano_api_url: >-
      {{ ((nano_api_url | length > 0) | ternary(nano_api_url,
          (nano_ingest_url | length == 0 and nanosiem_siem_ip | length > 0)
          | ternary('http://' ~ nanosiem_siem_ip, ''))) | regex_replace('/+$', '') }}
  when: nano_ingest_mode == 'hec'

- name: Decide whether the role issues the tokens
  ansible.builtin.set_fact:
    _nano_ingest_provision: >-
      {{ nano_ingest_mode == 'hec' and _nano_api_url | length > 0
         and (nano_api_key | length > 0 or (nano_api_email | length > 0 and nano_api_password | length > 0)) }}
  no_log: true

- name: Validate the token-provisioning API
  ansible.builtin.assert:
    that:
      - _nano_api_url is match('^https?://[^/\s]+$')
    fail_msg: "nano_api_url must be scheme://host[:port] with no path (got: {{ _nano_api_url }})"
    quiet: true
  when: _nano_ingest_provision | bool

- name: Validate hec-mode target and tokens
  ansible.builtin.assert:
    that:
      - nano_ingest_url | length > 0 or nanosiem_siem_ip | length > 0
      - _nano_ingest_url is match('^https?://[^/\s]+$')
      - _nano_ingest_sources | length > 0
      - _nano_ingest_sources | reject('match', '^[a-z][a-z0-9_]{0,62}$') | list | length == 0
      - (_nano_ingest_provision | bool) or nano_ingest_token | length > 0
        or (_nano_ingest_sources | difference(nano_ingest_source_tokens.keys() | list) | length == 0)
      - nano_ingest_token is match('^[A-Za-z0-9._~+/=-]*$')
      - nano_ingest_source_tokens.values() | reject('match', '^[A-Za-z0-9._~+/=-]+$') | list | length == 0
    fail_msg: >-
      nano_ingest_mode=hec needs nano_ingest_url (or nanosiem_siem_ip for an
      in-range open-core SIEM) as scheme://host[:port] with no path, and a
      token for every source in nano_ingest_sources (an entry in
      nano_ingest_source_tokens, the fallback nano_ingest_token, or nano API
      credentials so the role issues them: nano_api_key, or nano_api_email +
      nano_api_password). Sources must be lowercase
      source_type slugs; tokens must be plain token characters.
    quiet: true
  no_log: true
  when: nano_ingest_mode == 'hec'
