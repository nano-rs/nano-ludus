---
# Validate the forward-hop settings and derive the facts the config template
# reads (NAN-3397). Split out so tests/render.yml can render the template with
# exactly the role's own logic.
- name: Validate nano_ingest_mode
  ansible.builtin.assert:
    that:
      - nano_ingest_mode == 'hec'
    fail_msg: "The range requires authenticated HEC; raw Vector is loopback-only and has no source-bound authentication."
    quiet: true

- name: Refuse shared credentials
  ansible.builtin.fail:
    msg: Every source requires its own bound token; nano_ingest_token must be empty.
  when: nano_ingest_token | length > 0

- name: Refuse duplicate per-source credentials
  ansible.builtin.fail:
    msg: Each source must have a distinct token bound to that source.
  when: nano_ingest_source_tokens.values() | unique | length != nano_ingest_source_tokens | length

- name: Derive the HEC endpoint
  ansible.builtin.set_fact:
    _nano_ingest_url: >-
      {{ (nano_ingest_url | length > 0) | ternary(nano_ingest_url,
          'http://' ~ nanosiem_siem_ip ~ ':8088') | regex_replace('/+$', '') }}
  when: nano_ingest_mode == 'hec'

# The tokens the sinks use: the operator's per-source tokens, plus (open-core)
# the ones ingest_tokens.yml issues. A fact of its own, so it works however
# nano_ingest_source_tokens was passed (host var, role param, extra var).
- name: Start from the operator's per-source tokens
  ansible.builtin.set_fact:
    _nano_ingest_tokens: "{{ nano_ingest_source_tokens }}"
  no_log: true

- name: Derive the forwarded sources
  ansible.builtin.set_fact:
    _nano_ingest_sources: "{{ (nano_ingest_sources + (nano_ingest_source_tokens.keys() | list)) | unique | sort }}"
  when: nano_ingest_mode == 'hec'

# NAN-3841: on an open-core nano the role issues one token per source itself
# (ingest_tokens.yml) when it can reach the nano API with admin credentials.
- name: Derive the token-provisioning API
  ansible.builtin.set_fact:
    _nano_api_url: >-
      {{ ((nano_api_url | length > 0) | ternary(nano_api_url,
          (nano_ingest_url | length == 0 and nanosiem_siem_ip | length > 0)
          | ternary('http://' ~ nanosiem_siem_ip, ''))) | regex_replace('/+$', '') }}
  when: nano_ingest_mode == 'hec'

# NAN-3841: the in-range SIEM's admin password is random per range and kept on
# the Ludus controller by nano_lean; it is never a committed default.
- name: Look for the range's lab admin password on the controller
  ansible.builtin.stat:
    path: "{{ nano_lab_admin_password_file }}"
  delegate_to: localhost
  become: false
  register: _nano_lab_admin_password_stat
  when: >-
    nano_ingest_mode == 'hec' and _nano_api_url | length > 0
    and nano_api_key | length == 0 and nano_api_password | length == 0

- name: Adopt the API password
  ansible.builtin.set_fact:
    _nano_api_password: >-
      {{ nano_api_password if nano_api_password | length > 0 else
         (lookup('ansible.builtin.file', nano_lab_admin_password_file) | trim)
           if (_nano_lab_admin_password_stat.stat.exists | default(false)) else '' }}
  no_log: true

- name: Decide whether the role issues the tokens
  ansible.builtin.set_fact:
    _nano_ingest_provision: >-
      {{ nano_ingest_mode == 'hec' and _nano_api_url | length > 0
         and (nano_api_key | length > 0 or (nano_api_email | length > 0 and _nano_api_password | length > 0)) }}
  no_log: true

# Said before the (no_log) catch-all below so the operator sees where the
# generated password was expected. Names a path only, never a value.
- name: Require the range's lab admin password (or an override)
  ansible.builtin.fail:
    msg: >-
      The aggregator issues its ingest tokens over {{ _nano_api_url }} but has no
      credentials for it: the range's generated lab admin password is not at
      {{ nano_lab_admin_password_file }} on the Ludus controller (the SIEM's
      nano_lean role writes it - deploy that role first), and neither
      nano_api_password nor nano_api_key is set.
  when: >-
    nano_ingest_mode == 'hec' and _nano_api_url | length > 0
    and nano_api_key | length == 0 and _nano_api_password | length == 0
    and (_nano_ingest_sources | difference(_nano_ingest_tokens.keys() | list) | length > 0)

- name: Validate the token-provisioning API
  ansible.builtin.assert:
    that:
      - _nano_api_url is match('^https?://[^/\s]+$')
    fail_msg: "nano_api_url must be scheme://host[:port] with no path (got: {{ _nano_api_url }})"
    quiet: true
  when: _nano_ingest_provision | bool

- name: Validate hec-mode target and tokens
  ansible.builtin.assert:
    that:
      - nano_ingest_url | length > 0 or nanosiem_siem_ip | length > 0
      - _nano_ingest_url is match('^https?://[^/\s]+$')
      - _nano_ingest_sources | length > 0
      - _nano_ingest_sources | reject('match', '^[a-z][a-z0-9_]{0,62}$') | list | length == 0
      - (_nano_ingest_provision | bool)
        or (_nano_ingest_sources | difference(nano_ingest_source_tokens.keys() | list) | length == 0)
      - nano_ingest_token | length == 0
      - nano_ingest_source_tokens.values() | unique | length == nano_ingest_source_tokens | length
      - nano_ingest_source_tokens.values() | reject('match', '^[A-Za-z0-9._~+/=-]+$') | list | length == 0
    fail_msg: >-
      nano_ingest_mode=hec needs nano_ingest_url (or nanosiem_siem_ip for an
      in-range open-core SIEM) as scheme://host[:port] with no path, and a
      token for every source in nano_ingest_sources (an entry in
      nano_ingest_source_tokens, or nano API
      credentials so the role issues them: nano_api_key, nano_api_email +
      nano_api_password, or the range's generated lab admin password in
      {{ nano_lab_admin_password_file }} on the controller, which the SIEM's
      nano_lean role writes - deploy it first). Sources must be lowercase
      source_type slugs; tokens must be plain token characters.
    quiet: true
  no_log: true
  when: nano_ingest_mode == 'hec'
