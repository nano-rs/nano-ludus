---
- name: Validate the ingest target and derive its facts
  ansible.builtin.include_tasks: ingest_facts.yml

# NAN-2364: the healthcheck renders this through Jinja's `int` filter, which
# turns any non-numeric value into 0 - silently disabling the buffer check
# instead of failing. Catch a bad override here, where the error is visible.
- name: Validate buffer health threshold
  ansible.builtin.assert:
    that:
      - aggregator_health_buffer_pct is integer
      - aggregator_health_buffer_pct >= 0
      - aggregator_health_buffer_pct <= 100
    fail_msg: >-
      aggregator_health_buffer_pct must be an integer between 0 and 100
      (got: {{ aggregator_health_buffer_pct }}). 0 disables the buffer check.

- name: Install required packages
  ansible.builtin.apt:
    name:
      - docker-compose-plugin
      - curl
    state: present
    update_cache: true

- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ aggregator_deploy_dir }}"
    state: directory
    mode: "0755"

- name: Create config directory
  ansible.builtin.file:
    path: "{{ aggregator_deploy_dir }}/config"
    state: directory
    mode: "0755"

- name: Template Vector aggregator config
  ansible.builtin.template:
    src: vector-aggregator.toml.j2
    dest: "{{ aggregator_deploy_dir }}/config/vector.toml"
    mode: "0644"
  notify: restart vector-aggregator

# The forward hop's credentials live here, not in vector.toml (NAN-3397).
- name: Write the ingest tokens
  ansible.builtin.include_tasks: ingest_secrets.yml
  vars:
    _aggregator_secrets_dir: "{{ aggregator_deploy_dir }}/secrets"

- name: Restart the aggregator when a token changed
  ansible.builtin.debug:
    msg: "ingest tokens changed"
  changed_when: true
  when: _aggregator_secret_writes is changed or _aggregator_secret_removals is changed
  notify: restart vector-aggregator

- name: Template aggregator container healthcheck
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: "{{ aggregator_deploy_dir }}/healthcheck.sh"
    mode: "0755"
  notify: restart vector-aggregator

- name: Template docker-compose for aggregator
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ aggregator_deploy_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart vector-aggregator

# ---- Firewall ----
- name: Allow Vector agent connections
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ aggregator_vector_port }}"
    jump: ACCEPT
    comment: "Vector aggregator - agent intake"

- name: Allow Vector metrics
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "9598"
    jump: ACCEPT
    comment: "Vector aggregator - Prometheus metrics"

# ---- Start ----
- name: Pull the pinned Vector image
  ansible.builtin.shell: |
    cd {{ aggregator_deploy_dir }} && docker compose pull
  # Serialize the pull so it doesn't overwhelm the lab DNS forwarder (NAN-1230).
  environment:
    COMPOSE_PARALLEL_LIMIT: "1"
  register: aggregator_pull
  # The image is pinned by digest, so an already-present image is a no-op.
  changed_when: aggregator_pull.stderr is search('Download complete|Pull complete')
  # Retry transient lab-DNS timeouts mid-pull (NAN-1224).
  retries: 5
  delay: 15
  until: aggregator_pull.rc == 0

- name: Start Vector aggregator
  ansible.builtin.shell: |
    cd {{ aggregator_deploy_dir }} && docker compose up -d
  register: aggregator_up
  changed_when: aggregator_up.stderr is search('\\b(Created|Recreated|Started)\\b')

- name: Wait for Vector aggregator to be healthy
  ansible.builtin.uri:
    url: "http://localhost:9598/metrics"
    method: GET
    status_code: 200
  register: health_check
  retries: 15
  delay: 3
  until: health_check.status == 200

- name: Describe the forward hop
  ansible.builtin.set_fact:
    _aggregator_target: >-
      {% if nano_ingest_mode == 'hec' %}{{ _nano_ingest_url }} (Splunk HEC; sources {{ _nano_ingest_sources | join(', ') }}){%
      else %}{{ nanosiem_siem_ip }}:{{ nanosiem_siem_vector_port }} (Vector native, unauthenticated){% endif %}

- name: Print aggregator info
  ansible.builtin.debug:
    msg: |
      ============================================
      Vector Aggregator is running!
      ============================================
      Agent intake:  {{ ansible_default_ipv4.address }}:{{ aggregator_vector_port }} (Vector protocol)
      Metrics:       http://{{ ansible_default_ipv4.address }}:9598/metrics
      Forwarding to: {{ _aggregator_target }}
      ============================================

      Configure Windows Vector agents to point their vector sink at:
        address = "{{ ansible_default_ipv4.address }}:{{ aggregator_vector_port }}"
      ============================================
