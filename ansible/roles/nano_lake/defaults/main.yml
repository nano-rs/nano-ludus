---
# nano open-core lake install on the range's SIEM box (NAN-3397).
#
# Runs the product's own unattended installer (install.sh) with the lake
# profile: OCSF 1.9 object lake on RustFS, Vector 0.59 ingest, nginx UI/API.
# Nothing about the stack is forked here; the role only feeds install.sh its
# answers and opens the ingest ports.

# ---- Source ----
# Repository install.sh clones and runs from. It must carry the lake profile
# (docker-compose.opensource.yml with the lake-* services); the role refuses a
# checkout without it rather than silently deploying the legacy ClickHouse
# stack. As of 2026-10-09 the public mirror nano-rs/nano is still the legacy
# v0.1.703 snapshot (NAN-3309) and the nano-lake-* images are not public
# (NAN-3308), so point this at a lake-capable mirror until both land.
nano_lake_repo_url: "https://github.com/nano-rs/nano.git"
nano_lake_branch: "main"
# Image tag install.sh writes as NANO_VERSION.
nano_lake_version: "latest"

# Where the role checks the source out (to read install.sh) and where
# install.sh installs the stack.
nano_lake_src_dir: /opt/nano-src
nano_lake_install_dir: /opt/nano
# install.sh output (0600). It holds the admin password and ingest token, so
# the role never echoes it; it greps failures out of it with secrets filtered.
nano_lake_install_log: /root/nano-lake-install.log

# Extra environment for install.sh, e.g. {NANO_SKIP_IMAGE_VERIFY: "1"}.
nano_lake_install_env: {}

# install.sh is safe to re-run (it keeps .env and restarts the stack). By
# default the role runs it once and leaves later deploys alone; set true to
# re-run it on every deploy (upgrades, image re-pulls).
nano_lake_rerun_install: false

# ---- Admin account (install.sh posts /api/setup/initialize) ----
nano_lake_base_url: "http://{{ ansible_default_ipv4.address }}"
nano_lake_admin_email: "admin@lab.local"
nano_lake_admin_name: "Lab Admin"
# Empty = generated on the SIEM box on first run and kept in
# nano_lake_admin_file (0600), so re-deploys reuse it.
nano_lake_admin_password: ""
nano_lake_admin_file: /root/.nano-lab-admin

# ---- Ingest token ----
# install.sh generates VECTOR_AUTH_TOKEN, the bearer for HTTP :8080,
# nginx /ingest/, HEC :8088 and OTLP :4318. Set this to pin it instead, so the
# range's aggregator (nano_ingest_token) can be configured before the SIEM
# exists. Empty = keep the generated one; read it from
# {{ nano_lake_install_dir }}/.env on the SIEM box.
nano_lake_ingest_token: ""

# ---- Sizing ----
# install.sh accepts 12 GiB, but its automatic memory plan at 12 GiB gives the
# durable large query class the same budget as medium, and nano-lake-job-runner
# then crash-loops ("durable large resource class must exceed the medium
# memory..."). 13 GiB is the smallest box that comes up clean; the blueprint
# gives the SIEM 16 GB. Fail early instead of deploying a broken stack.
nano_lake_min_memory_mb: 13000

# ---- Firewall ----
# 80 nginx (UI, API, /ingest/) · 8080 HTTP JSON · 8088 HEC · 4318 OTLP/HTTP ·
# 6000 Vector native (UNAUTHENTICATED - drop it from this list unless an
# in-range aggregator uses nano_ingest_mode=vector).
nano_lake_firewall_ports: [80, 8080, 8088, 4318, 6000]

# ---- Parsers ----
# OCSF parsers to deploy from the bundled parser repository after install, by
# source_type. Open-core ships with only the OTLP parser live; without these
# the range's events are stored raw. Empty list = deploy nothing.
nano_lake_parsers:
  - windows_event
  - windows_sysmon
  - conduit_proxy
