---
# nano open-core lake install (NAN-3397). See defaults/main.yml.
- name: Check the box is large enough for the lake profile
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb | int >= nano_lake_min_memory_mb | int
    fail_msg: >-
      The lake profile needs at least 13 GiB; this box has {{ ansible_memtotal_mb }} MB.
      Raise ram_gb in the range config (or lower nano_lake_min_memory_mb if you
      know the load is small).
    quiet: true

- name: Validate the pinned ingest token
  ansible.builtin.assert:
    that:
      - nano_lake_ingest_token | length == 0 or nano_lake_ingest_token is match('^[A-Za-z0-9_-]{24,256}$')
    fail_msg: "nano_lake_ingest_token must be 24-256 base64url characters (or empty to keep the generated one)"
    quiet: true
  no_log: true

- name: Install installer prerequisites
  ansible.builtin.apt:
    name:
      - git
      - curl
      - openssl
      - ca-certificates
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Check out the open-core source
  ansible.builtin.git:
    repo: "{{ nano_lake_repo_url }}"
    dest: "{{ nano_lake_src_dir }}"
    version: "{{ nano_lake_branch }}"
    depth: 1
    force: true
  register: nano_lake_src
  retries: 5
  delay: 15
  until: nano_lake_src is succeeded

# Refuse a source without the lake profile instead of deploying the legacy
# ClickHouse stack under a lake role name.
- name: Read the source's compose file
  ansible.builtin.slurp:
    src: "{{ nano_lake_src_dir }}/docker-compose.opensource.yml"
  register: nano_lake_compose

- name: Require the lake profile
  ansible.builtin.assert:
    that:
      - "'lake-object-store:' in (nano_lake_compose.content | b64decode)"
    fail_msg: >-
      {{ nano_lake_repo_url }}@{{ nano_lake_branch }} has no lake profile
      (no lake-object-store service in docker-compose.opensource.yml). The
      public mirror nano-rs/nano still carries the legacy ClickHouse stack
      (NAN-3309); point nano_lake_repo_url at a lake-capable source.
    quiet: true

# The API requires upper, lower, digit and a special character; the random
# part is base64 letters/digits, the fixed tail guarantees the rest.
- name: Generate the admin password on first run
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail && umask 077 &&
      printf 'email=%s\npassword=%s\nurl=%s\n'
      '{{ nano_lake_admin_email }}'
      "$(openssl rand -base64 30 | tr -d '/+=\n' | cut -c1-24)-Lab9"
      '{{ nano_lake_base_url }}' > {{ nano_lake_admin_file }}
    creates: "{{ nano_lake_admin_file }}"
    executable: /bin/bash
  when: nano_lake_admin_password | length == 0
  no_log: true

- name: Read the generated admin password
  ansible.builtin.slurp:
    src: "{{ nano_lake_admin_file }}"
  register: nano_lake_admin_slurp
  when: nano_lake_admin_password | length == 0
  no_log: true

- name: Adopt the admin password
  ansible.builtin.set_fact:
    _nano_lake_admin_password: >-
      {{ nano_lake_admin_password if nano_lake_admin_password | length > 0 else
         (nano_lake_admin_slurp.content | b64decode | regex_search('(?m)^password=(.*)$', '\1') | first) }}
  no_log: true

- name: Check for an existing install
  ansible.builtin.stat:
    path: "{{ nano_lake_install_dir }}/.env"
  register: nano_lake_env

- name: Assemble the installer's answers
  ansible.builtin.set_fact:
    _nano_lake_install_env:
      NANO_REPO_URL: "{{ nano_lake_repo_url }}"
      NANO_BRANCH: "{{ nano_lake_branch }}"
      NANO_VERSION: "{{ nano_lake_version }}"
      NANO_INSTALL_DIR: "{{ nano_lake_install_dir }}"
      NANO_ENABLE_LAKE_CONTROL_PLANE: "1"
      NANO_SCHEMA_PROFILE: ocsf
      NANO_BASE_URL: "{{ nano_lake_base_url }}"
      NANO_ADMIN_EMAIL: "{{ nano_lake_admin_email }}"
      NANO_ADMIN_NAME: "{{ nano_lake_admin_name }}"
      NANO_ADMIN_PASSWORD: "{{ _nano_lake_admin_password }}"
      # Serialized pulls spare the Ludus lab DNS forwarder (NAN-1230).
      COMPOSE_PARALLEL_LIMIT: "1"
  no_log: true

# install.sh prints the admin password and ingest token on success, so its
# output goes to a 0600 log on the box and never into the Ansible output.
#
# setsid + </dev/null: install.sh always asks "Public base URL" on /dev/tty,
# even with NANO_BASE_URL set, and Ansible's ssh connection gives the task a
# pty, so the unattended run blocks on that read forever. Without a
# controlling terminal the prompt falls back to NANO_BASE_URL.
#
# The log is created 0600 up front instead of running under umask 077: the
# installer's checkout is bind-mounted into non-root containers (Hydra reads
# its hydra.yml), so a restrictive umask breaks the stack.
- name: Create the installer log (0600)
  ansible.builtin.file:
    path: "{{ nano_lake_install_log }}"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  when: not nano_lake_env.stat.exists or nano_lake_rerun_install | bool

- name: Run the open-core installer (lake profile)
  ansible.builtin.shell:
    cmd: >-
      setsid --wait bash {{ nano_lake_src_dir }}/install.sh
      < /dev/null >> {{ nano_lake_install_log }} 2>&1
    chdir: /root
    executable: /bin/bash
  environment: "{{ nano_lake_install_env | combine(_nano_lake_install_env) }}"
  register: nano_lake_install
  changed_when: true
  failed_when: false
  no_log: true
  when: not nano_lake_env.stat.exists or nano_lake_rerun_install | bool

- name: Show why the installer stopped (secrets filtered)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      grep -v -i -E 'token|password|secret|key|bearer|splunk ' {{ nano_lake_install_log }}
      | sed 's/\x1b\[[0-9;]*m//g' | tail -25
    executable: /bin/bash
  register: nano_lake_install_tail
  changed_when: false
  when: nano_lake_install.rc is defined and nano_lake_install.rc != 0

# A fresh lake's first boot can outlast Compose's dependency wait (nano-api
# reports unhealthy until the query worker admits its bootstrap generation),
# and install.sh then exits before creating the admin account - and skips it
# on every re-run because .env now exists. Fail only if the stack never comes
# up; the tasks below converge it and create the admin account themselves.
- name: Note an installer exit the role will converge from
  ansible.builtin.debug:
    msg: "install.sh exited {{ nano_lake_install.rc }}; converging the stack. Last lines:\n{{ nano_lake_install_tail.stdout }}"
  when: nano_lake_install.rc is defined and nano_lake_install.rc != 0

- name: Require the installer to have written its .env
  ansible.builtin.stat:
    path: "{{ nano_lake_install_dir }}/.env"
  register: nano_lake_env_after
  failed_when: not nano_lake_env_after.stat.exists

# Pin the ingest token the range's shippers were configured with. Only Vector
# (and the env guard) read VECTOR_AUTH_TOKEN, so a compose up recreates just
# those services.
- name: Pin the ingest token
  ansible.builtin.lineinfile:
    path: "{{ nano_lake_install_dir }}/.env"
    regexp: '^VECTOR_AUTH_TOKEN='
    line: "VECTOR_AUTH_TOKEN={{ nano_lake_ingest_token }}"
    mode: "0600"
  no_log: true
  when: nano_lake_ingest_token | length > 0
  notify: Recreate nano lake services

- name: Apply the pinned token now
  ansible.builtin.meta: flush_handlers

- name: Open the ingest and UI ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "nano lake {{ item }}"
  loop: "{{ nano_lake_firewall_ports }}"

# Idempotent: starts whatever a slow first boot (or a reboot) left stopped.
- name: Ensure every lake service is up
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.opensource.yml up -d
    chdir: "{{ nano_lake_install_dir }}"
  environment:
    COMPOSE_PARALLEL_LIMIT: "1"
  register: nano_lake_up
  # One-shot init containers (migrations, bootstrap) exit 0 and are "Started"
  # again on every `up -d`; only a created/recreated service is a real change.
  changed_when: nano_lake_up.stderr is search('\\b(Created|Recreated)\\b')
  retries: 10
  delay: 30
  until: nano_lake_up.rc == 0

- name: Wait for the API through nginx
  ansible.builtin.uri:
    url: "http://localhost/api/health"
    status_code: 200
  register: nano_lake_health
  retries: 60
  delay: 5
  until: nano_lake_health.status == 200

- name: Wait for the HEC lane
  ansible.builtin.uri:
    url: "http://localhost:8088/services/collector/health"
    status_code: 200
  register: nano_lake_hec
  retries: 30
  delay: 5
  until: nano_lake_hec.status == 200

- name: Read the setup status
  ansible.builtin.uri:
    url: "http://localhost/api/setup/status"
    return_content: true
  register: nano_lake_setup

- name: Create the admin account (when install.sh did not)
  ansible.builtin.uri:
    url: "http://localhost/api/setup/initialize"
    method: POST
    body_format: json
    body:
      email: "{{ nano_lake_admin_email }}"
      name: "{{ nano_lake_admin_name }}"
      password: "{{ _nano_lake_admin_password }}"
    status_code: [200, 201]
  no_log: true
  when: not (nano_lake_setup.json.initialized | default(false))

- name: Deploy the range's OCSF parsers
  ansible.builtin.include_tasks: parsers.yml
  when: nano_lake_parsers | length > 0

- name: Print access info
  ansible.builtin.debug:
    msg: |
      ============================================
      nano open-core lake is running
      ============================================
      UI / API:  {{ nano_lake_base_url }}
      Admin:     {{ nano_lake_admin_email }} (password in {{ nano_lake_admin_file }} on this box)
      Ingest token: VECTOR_AUTH_TOKEN in {{ nano_lake_install_dir }}/.env{{ ' (pinned by nano_lake_ingest_token)' if nano_lake_ingest_token | length > 0 else '' }}
        HEC:     http://{{ ansible_default_ipv4.address }}:8088/services/collector/event  (Authorization: Splunk <token>)
        HTTP:    http://{{ ansible_default_ipv4.address }}:8080/  or  {{ nano_lake_base_url }}/ingest/  (Authorization: Bearer <token>)
        OTLP:    http://{{ ansible_default_ipv4.address }}:4318/v1/logs  (Authorization: Bearer <token>)
        Vector:  {{ ansible_default_ipv4.address }}:6000  (UNAUTHENTICATED)
      Parsers deployed: {{ nano_lake_parsers | join(', ') if nano_lake_parsers | length > 0 else 'none' }}
      ============================================
