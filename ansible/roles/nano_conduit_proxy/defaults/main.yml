---
# Conduit MITM Proxy Configuration

# ---- Docker images ----
# Conduit is a separate open-source project (github.com/the2dl/conduit), not
# part of nano; the range only uses it. Its build workflow publishes public
# GHCR images tagged with the short commit. The range pins one build by tag and
# multi-architecture index digest, so a new Conduit push cannot change the lab.
# To bump: pick a newer commit, read both digests from the registry, and update
# conduit_version, conduit_repo_version and the two digests together.
conduit_proxy_image: "ghcr.io/the2dl/conduit-proxy"
conduit_api_image: "ghcr.io/the2dl/conduit-api"
conduit_version: "0a07c56"
conduit_proxy_digest: "sha256:cf51da6d803f32b661dad40281d482ddb1b288875f0586367b4c545a55d7356f"
conduit_api_digest: "sha256:384c10c2103436ea86e97e4d59d912b8d8e5b3610cb1c7ebacbee119da1196f5"
# Conduit's Dragonfly cache, pinned to a release by multi-architecture digest.
conduit_dragonfly_image: "docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184"

# ---- Build from source (fallback if the images are unavailable) ----
# Builds the same commit locally; compose then runs the local images.
conduit_build_from_source: false
conduit_repo_url: "https://github.com/the2dl/conduit.git"
conduit_repo_version: "0a07c56e1a333ceb305eb5a176db2d63b59c8a38"

# ---- Networking ----
conduit_proxy_port: 8888
conduit_api_port: 8443
conduit_metrics_port: 9091
conduit_dragonfly_port: 6380

# ---- Proxy settings ----
conduit_tls_intercept: true
conduit_auth_required: false  # Disable for lab simplicity
conduit_fail_closed: false    # Lab — don't block if policy store empty

# ---- CA certs ----
# Auto-generated at runtime if not provided
conduit_ca_cert_path: ""
conduit_ca_key_path: ""

# ---- Cache ----
conduit_cache_enabled: true
conduit_cache_max_size_mb: 128

# ---- Logging ----
conduit_log_level: "info"

# ---- Deploy directory ----
conduit_deploy_dir: /opt/conduit-proxy

# ---- Vector aggregator (local on same box) ----
# Latest full upstream Vector build. The nano server image is nano's
# feature-minimized fork and does not carry the Vector sink this sidecar needs.
conduit_vector_image: "timberio/vector:0.62.0-alpine@sha256:149c77c09aabf16a3aa543abf9cea2e2152c1d9a7d4a45669fe7ad05f4ed8b27"
conduit_vector_aggregator_port: 9000

# Disk buffer for the proxy's log lane, in bytes (512MB default)
conduit_buffer_max_bytes: 536870912

# What to do when that buffer fills (NAN-2364). drop_newest sheds events;
# block stalls the proxy's log lane and does not recover on restart.
conduit_buffer_when_full: drop_newest
