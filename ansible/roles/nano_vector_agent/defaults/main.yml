---
# Vector Windows Agent Configuration

# ---- Aggregator target ----
# IP of the Vector aggregator (proxy box)
vector_aggregator_ip: ""  # REQUIRED - set in role_vars
vector_aggregator_port: 9000

# ---- Vector version ----
# Pinned to the release the platform runs (Vector 0.59, VRL 0.36), which ships
# the windows_event_log source in the stable Windows build (NAN-3397; the role
# used a floating nightly before). An agent already on another version is
# upgraded in place on the next deploy.
vector_version: "0.59.0"
vector_msi_url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x64.msi"
# sha256 of the 0.59.0 MSI. Change it together with vector_version (or set ""
# to skip the check for a build you cannot pin).
vector_msi_sha256: "8d1aefe9a2c7b4d440dd211a7646f76ad201d31c9dcbe1d3eb2664ce12a0b1cd"

# ---- Windows Event Log channels ----
vector_eventlog_channels:
  - "Application"
  - "System"
  - "Security"
  - "Microsoft-Windows-Sysmon/Operational"
  - "Microsoft-Windows-PowerShell/Operational"
  - "Microsoft-Windows-Windows Defender/Operational"

# Read existing events on first run (backfill)
vector_read_existing_events: false

# Rate limit (events per second per channel)
vector_events_per_second: 500

# Max field length for event_data values (truncation)
vector_max_event_data_length: 2000

# ---- Install paths ----
vector_install_dir: 'C:\Program Files\Vector'
vector_config_dir: 'C:\ProgramData\Vector'
vector_data_dir: 'C:\ProgramData\Vector\data'

# ---- Buffer ----
# Disk buffer max size in bytes (512MB default for agent)
vector_buffer_max_bytes: 536870912

# What the agent does when that buffer fills (NAN-2364).
#   drop_newest - shed new events, keep collecting (default; lab-safe)
#   block       - apply backpressure, which freezes the windows_event_log
#                 source for as long as the aggregator cannot accept events;
#                 restarting preserves the backlog rather than clearing it, so
#                 it does not restore collection. Only choose this if you would
#                 rather lose collection than lose events.
vector_buffer_when_full: drop_newest

# ---- Conduit MITM Proxy (optional) ----
# Set to configure system proxy + install CA cert on this Windows box
conduit_proxy_enabled: false
conduit_proxy_ip: ""        # IP of the proxy box (same as aggregator typically)
conduit_proxy_port: 8888
conduit_api_port: 8443
