---
# nano v2 open-core install on the range SIEM box.
#
# The role runs the product's own install.sh with its documented environment.
# It does not vendor or patch the compose stack.

# ---- Source ----
nanosiem_repo_url: "https://github.com/nano-rs/nano.git"
# The release a customer gets from `curl -fsSL https://get.nano.rs | bash`.
# The public mirror tags every open-core release. The role checks out that tag,
# and install.sh clones the same tag into nanosiem_install_dir, so the
# installer, compose files and images.lock all describe one release.
# This is the only place the range names its release: bump it here.
# 2.0.35 is the minimum, for install.sh --non-interactive.
nanosiem_version: "2.0.35"
nanosiem_ref: "v{{ nanosiem_version }}"
# The one-line installer endpoint. The role compares it with the tagged
# install.sh and reports drift without failing, because get.nano.rs moves to
# each new release. Empty skips the comparison.
nanosiem_get_url: "https://get.nano.rs"

nanosiem_source_dir: /opt/nano-v2-source
nanosiem_install_dir: /opt/nano
# The pre-v2 Ludus role used this compose file and fixed nano-* container
# names. Stop that exact stack before install.sh starts v2; do not remove its
# volumes, so an operator can recover the old lab data if needed.
nanosiem_legacy_compose_file: /opt/nanosiem/docker-compose.yml
nanosiem_install_log: /root/nano-v2-install.log
nanosiem_install_marker: /root/.nano-lab-v2-installed
nanosiem_install_env: {}
# Root-only file that hands install.sh its environment; removed after the run.
nanosiem_install_env_file: /root/.nano-lab-install.env
# install.sh is stopped and the deploy fails after this many seconds.
nanosiem_install_timeout: 3600
nanosiem_rerun_install: false

# ---- Admin account ----
nanosiem_base_url: "http://{{ ansible_default_ipv4.address }}"
nanosiem_admin_email: "admin@lab.local"
nanosiem_admin_name: "Lab Admin"
# Empty = generate once per range. Never put a real password in this public repo.
nanosiem_admin_password: ""
nanosiem_admin_password_file: /root/.nano-lab-admin-password
nanosiem_admin_file: /root/.nano-lab-admin

# ---- Profile and network ----
nanosiem_schema_profile: ocsf
# Remote authenticated ingest only. Raw OTLP and Vector native remain loopback.
nanosiem_firewall_ports: [80, 8080, 8088]

# ---- Parsers ----
# OCSF parsers required by the range. Empty list deploys none.
nanosiem_parsers:
  - windows_event
  - windows_sysmon
  - conduit_proxy
