---
# ClickHouse 26.6+ has no amd64 compatibility image and requires AVX2. Fail
# before cloning or pulling so a Proxmox CPU-model mismatch is actionable.
- name: Check x86-64 CPU support for ClickHouse 26.6+
  ansible.builtin.command: grep -qw avx2 /proc/cpuinfo
  register: _nanosiem_avx2
  changed_when: false
  failed_when: false
  when: ansible_facts['architecture'] in ['x86_64', 'amd64']

- name: Require AVX2 for ClickHouse 26.6+
  ansible.builtin.fail:
    msg: >-
      nano v2's ClickHouse 26.6+ image requires AVX2. Expose AVX2 to this VM
      (Proxmox CPU type 'host' or x86-64-v3) and redeploy the range.
  when:
    - ansible_facts['architecture'] in ['x86_64', 'amd64']
    - _nanosiem_avx2.rc != 0

- name: Require the OCSF profile
  ansible.builtin.assert:
    that:
      - nanosiem_schema_profile == 'ocsf'
    fail_msg: "The Ludus v2 range requires nanosiem_schema_profile=ocsf"
    quiet: true

- name: Install installer prerequisites
  ansible.builtin.apt:
    name:
      - git
      - curl
      - openssl
      - ca-certificates
      - python3
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Check out the v2 open-core source
  ansible.builtin.git:
    repo: "{{ nanosiem_repo_url }}"
    dest: "{{ nanosiem_source_dir }}"
    version: "{{ nanosiem_ref }}"
    # No depth: ansible.builtin.git fails to re-fetch a shallow tag checkout,
    # which breaks every redeploy. The full repository is small.
    force: true
  register: nanosiem_source
  retries: 5
  delay: 15
  until: nanosiem_source is succeeded

- name: Read the source installer
  ansible.builtin.slurp:
    src: "{{ nanosiem_source_dir }}/install.sh"
  register: _nanosiem_installer

- name: Read the source compose file
  ansible.builtin.slurp:
    src: "{{ nanosiem_source_dir }}/docker-compose.opensource.yml"
  register: _nanosiem_compose

- name: Require the v2 ClickHouse installer
  ansible.builtin.assert:
    that:
      - "'RELEASE_FLOOR_MAJOR=2' in (_nanosiem_installer.content | b64decode)"
      - "'NANO_SCHEMA_PROFILE' in (_nanosiem_installer.content | b64decode)"
      - "'clickhouse/clickhouse-server' in (_nanosiem_compose.content | b64decode)"
    fail_msg: >-
      {{ nanosiem_repo_url }}@{{ nanosiem_ref }} is not the v2 ClickHouse
      open-core source. Pin a v2 open-core release with nanosiem_version.
    quiet: true

# A tag whose images.lock records another release would mix one release's
# installer and compose files with another's images.
- name: Read the source images.lock
  ansible.builtin.slurp:
    src: "{{ nanosiem_source_dir }}/images.lock"
  register: _nanosiem_lock

- name: Read the release recorded in images.lock
  ansible.builtin.set_fact:
    _nanosiem_lock_release: >-
      {{ _nanosiem_lock.content | b64decode
         | regex_findall('(?m)^# Release: v?(\S+)') | first | default('') }}

- name: Require images.lock to record the pinned release
  ansible.builtin.assert:
    that:
      - _nanosiem_lock_release == nanosiem_version
    fail_msg: >-
      {{ nanosiem_repo_url }}@{{ nanosiem_ref }} images.lock records release
      {{ _nanosiem_lock_release or 'none' }}, not {{ nanosiem_version }}.
    quiet: true

- name: Fetch the one-line installer
  ansible.builtin.uri:
    url: "{{ nanosiem_get_url }}"
    return_content: true
  register: _nanosiem_get
  failed_when: false
  when: nanosiem_get_url | length > 0

- name: Compare the one-line installer with the pinned release
  ansible.builtin.debug:
    msg: "{{ _nanosiem_get_msg | trim }}"
  vars:
    _nanosiem_get_msg: >-
      {% if _nanosiem_get.status | default(0) != 200 %}
      Could not fetch {{ nanosiem_get_url }} (status {{ _nanosiem_get.status | default('none') }}); not compared.
      {% elif (_nanosiem_get.content | hash('sha256')) == (_nanosiem_installer.content | b64decode | hash('sha256')) %}
      {{ nanosiem_get_url }} serves the v{{ nanosiem_version }} install.sh.
      {% else %}
      {{ nanosiem_get_url }} serves a different install.sh than v{{ nanosiem_version }};
      a newer release is probably out. Bump nanosiem_version to test it.
      {% endif %}
  when: nanosiem_get_url | length > 0

# The Ludus control node's home is read-only. Generate and persist the password
# on the SIEM target, then let the aggregator read it by delegating to this host.
- name: Persist an operator-supplied admin password
  ansible.builtin.copy:
    content: "{{ nanosiem_admin_password }}\n"
    dest: "{{ nanosiem_admin_password_file }}"
    mode: "0600"
  when: nanosiem_admin_password | length > 0
  diff: false
  no_log: true

- name: Generate the persistent range admin password on the SIEM
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      umask 077
      password="$(openssl rand -base64 24 | tr -d '\n')"
      printf '%s-Lab9\n' "$password" > {{ nanosiem_admin_password_file | quote }}
    executable: /bin/bash
    creates: "{{ nanosiem_admin_password_file }}"
  no_log: true
  when: nanosiem_admin_password | length == 0

- name: Read the persistent range admin password
  ansible.builtin.slurp:
    src: "{{ nanosiem_admin_password_file }}"
  register: _nanosiem_admin_password_raw
  no_log: true

- name: Adopt the admin password
  ansible.builtin.set_fact:
    _nanosiem_admin_password: "{{ _nanosiem_admin_password_raw.content | b64decode | trim }}"
  no_log: true

- name: Keep the admin password on the SIEM box
  ansible.builtin.copy:
    content: |
      email={{ nanosiem_admin_email }}
      password={{ _nanosiem_admin_password }}
      url={{ nanosiem_base_url }}
    dest: "{{ nanosiem_admin_file }}"
    mode: "0600"
  diff: false
  no_log: true

- name: Check for a completed v2 install
  ansible.builtin.stat:
    path: "{{ nanosiem_install_marker }}"
  register: nanosiem_done

# The marker records the installed release. Markers written before it did are
# empty, so those ranges reinstall once.
- name: Read the installed release
  ansible.builtin.slurp:
    src: "{{ nanosiem_install_marker }}"
  register: _nanosiem_marker
  when: nanosiem_done.stat.exists

- name: Decide whether to run install.sh
  ansible.builtin.set_fact:
    _nanosiem_run_install: >-
      {{ not nanosiem_done.stat.exists
         or (_nanosiem_marker.content | b64decode | trim) != nanosiem_version
         or nanosiem_rerun_install | bool }}

# These are the installer's documented inputs. install.sh runs with
# --non-interactive: it never reads /dev/tty (Ansible's become leaves a PTY
# attached), every other question takes its documented default, and a missing
# or invalid required value stops it with exit 4 before it changes anything.
- name: Assemble the installer environment
  ansible.builtin.set_fact:
    _nanosiem_install_env:
      NANO_REPO_URL: "{{ nanosiem_repo_url }}"
      NANO_BRANCH: "{{ nanosiem_ref }}"
      NANO_INSTALL_DIR: "{{ nanosiem_install_dir }}"
      NANO_BASE_URL: "{{ nanosiem_base_url }}"
      NANO_ADMIN_EMAIL: "{{ nanosiem_admin_email }}"
      NANO_ADMIN_NAME: "{{ nanosiem_admin_name }}"
      NANO_ADMIN_PASSWORD: "{{ _nanosiem_admin_password }}"
      NANO_SCHEMA_PROFILE: "{{ nanosiem_schema_profile }}"
      COMPOSE_PARALLEL_LIMIT: "1"
  no_log: true
  when: _nanosiem_run_install | bool

# Re-running install.sh over an existing install is an upgrade or restart.
# Unattended, install.sh stops at the sender-pause check when the running Vector
# predates v2.0.32 unless this is set. It bypasses no digest, sizing or
# legacy-upgrade guard.
- name: Confirm the upgrade for an existing install
  ansible.builtin.set_fact:
    _nanosiem_install_env: "{{ _nanosiem_install_env | combine({'NANO_CONFIRM_UPGRADE': '1'}) }}"
  no_log: true
  when: _nanosiem_run_install | bool and nanosiem_done.stat.exists

- name: Add an explicit image version when configured
  ansible.builtin.set_fact:
    _nanosiem_install_env: "{{ _nanosiem_install_env | combine({'NANO_VERSION': nanosiem_version}) }}"
  no_log: true
  when: _nanosiem_run_install | bool and nanosiem_version | length > 0

- name: Create the private installer log
  ansible.builtin.file:
    path: "{{ nanosiem_install_log }}"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  when: _nanosiem_run_install | bool

- name: Check for the pre-v2 Ludus compose stack
  ansible.builtin.stat:
    path: "{{ nanosiem_legacy_compose_file }}"
  register: _nanosiem_legacy_compose
  when: _nanosiem_run_install | bool

- name: Find pre-v2 Ludus stack containers
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ nanosiem_legacy_compose_file | quote }}
      ps --all --quiet
  register: _nanosiem_legacy_containers
  changed_when: false
  when:
    - _nanosiem_run_install | bool
    - _nanosiem_legacy_compose.stat.exists

- name: Stop the pre-v2 Ludus stack without deleting its data
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ nanosiem_legacy_compose_file | quote }}
      down --remove-orphans
  changed_when: true
  when:
    - _nanosiem_run_install | bool
    - _nanosiem_legacy_compose.stat.exists
    - _nanosiem_legacy_containers.stdout | trim | length > 0

# Ansible's environment: keyword puts every variable on the become command
# line, where any local user can read the admin password with ps. Hand the
# installer its environment in a root-only file instead, and always remove it.
- name: Require shell variable names in nanosiem_install_env
  ansible.builtin.assert:
    that:
      - nanosiem_install_env.keys() | reject('match', '^[A-Za-z_][A-Za-z0-9_]*$') | list | length == 0
    fail_msg: "nanosiem_install_env keys must be shell variable names."
    quiet: true
  when: _nanosiem_run_install | bool and nanosiem_install_env | length > 0

- name: Run the documented v2 open-core installer
  when: _nanosiem_run_install | bool
  block:
    - name: Write the private installer environment
      ansible.builtin.copy:
        content: |
          {% for key, value in (nanosiem_install_env | combine(_nanosiem_install_env)).items() %}
          export {{ key }}={{ ((value | string | lower) if value is boolean else (value | string)) | quote }}
          {% endfor %}
        dest: "{{ nanosiem_install_env_file }}"
        owner: root
        group: root
        mode: "0600"
      diff: false
      no_log: true

    # The environment file is deleted as soon as it is read, so a cancelled
    # deploy does not leave the password on disk. timeout -k escalates to
    # SIGKILL if install.sh does not stop on SIGTERM.
    - name: Run install.sh without a controlling terminal
      ansible.builtin.shell:
        cmd: >-
          timeout -k 30 {{ nanosiem_install_timeout | int }}
          bash -c 'set -e; . "$1"; rm -f -- "$1"; exec bash "$2" --non-interactive' nano-install
          {{ nanosiem_install_env_file | quote }}
          {{ (nanosiem_source_dir ~ "/install.sh") | quote }}
          < /dev/null >> {{ nanosiem_install_log | quote }} 2>&1
        chdir: /root
        executable: /bin/bash
      register: nanosiem_install
      changed_when: true
      failed_when: false
      no_log: true
  always:
    - name: Remove the private installer environment
      ansible.builtin.file:
        path: "{{ nanosiem_install_env_file }}"
        state: absent

- name: Fail on an installer error
  ansible.builtin.fail:
    msg: >-
      {% if nanosiem_install.rc in [124, 137] %}install.sh did not finish within
      {{ nanosiem_install_timeout }} seconds and was stopped{% elif nanosiem_install.rc == 4 %}install.sh
      stopped on missing or invalid installer input (exit 4) before changing
      anything; the log names each value it needs{% else %}install.sh
      exited {{ nanosiem_install.rc }}{% endif %}. Inspect the private log
      {{ nanosiem_install_log }} on the SIEM box; its contents are not copied
      into Ansible output.
  when: nanosiem_install.rc is defined and nanosiem_install.rc != 0

- name: Record the installed release
  ansible.builtin.copy:
    content: "{{ nanosiem_version }}\n"
    dest: "{{ nanosiem_install_marker }}"
    mode: "0644"
  when: _nanosiem_run_install | bool

- name: Open the UI and authenticated ingest ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "nano v2 {{ item }}"
  loop: "{{ nanosiem_firewall_ports }}"

- name: Ensure the v2 stack is up
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.opensource.yml up -d
    chdir: "{{ nanosiem_install_dir }}"
  environment:
    COMPOSE_PARALLEL_LIMIT: "1"
  register: nanosiem_up
  changed_when: nanosiem_up.stderr is search('\\b(Created|Recreated)\\b')
  retries: 10
  delay: 30
  until: nanosiem_up.rc == 0

- name: Wait for the API through nginx
  ansible.builtin.uri:
    url: "http://localhost/api/health"
    status_code: 200
  register: nanosiem_health
  retries: 60
  delay: 5
  until: nanosiem_health.status == 200

- name: Wait for HEC
  ansible.builtin.uri:
    url: "http://localhost:8088/services/collector/health"
    status_code: 200
  register: nanosiem_hec
  retries: 30
  delay: 5
  until: nanosiem_hec.status == 200

- name: Deploy the range OCSF parsers
  ansible.builtin.include_tasks: parsers.yml
  when: nanosiem_parsers | length > 0

- name: Print access info
  ansible.builtin.debug:
    msg: |
      ============================================
      nano v2 open core is running
      ============================================
      UI / API:  {{ nanosiem_base_url }}
      Admin:     {{ nanosiem_admin_email }} (password in {{ nanosiem_admin_file }})
      Release:   v{{ nanosiem_version }} ({{ nanosiem_repo_url }}@{{ nanosiem_ref }})
      Profile:   OCSF on ClickHouse
      Ingest:    HEC http://{{ ansible_default_ipv4.address }}:8088/services/collector/event
      Parsers:   {{ nanosiem_parsers | join(', ') if nanosiem_parsers | length > 0 else 'none' }}
      The range aggregator issues one source-bound token per parser route.
      ============================================
