---
# Import and deploy the range OCSF parsers from nano-rs/parsers.
- name: Log in as the lab admin
  ansible.builtin.uri:
    url: "http://localhost/api/auth/login"
    method: POST
    body_format: json
    body:
      email: "{{ nanosiem_admin_email }}"
      password: "{{ _nanosiem_admin_password }}"
  register: _nanosiem_login
  no_log: true

- name: Remember the admin session
  ansible.builtin.set_fact:
    _nanosiem_auth:
      Authorization: "Bearer {{ _nanosiem_login.json.tokens.access_token }}"
  no_log: true

- name: List parser repositories
  ansible.builtin.uri:
    url: "http://localhost/api/parser-repositories"
    headers: "{{ _nanosiem_auth }}"
  register: _nanosiem_repos
  no_log: true

- name: Add nano-rs/parsers
  ansible.builtin.uri:
    url: "http://localhost/api/parser-repositories"
    method: POST
    headers: "{{ _nanosiem_auth }}"
    body_format: json
    body:
      name: nano-rs/parsers
      url: https://github.com/nano-rs/parsers
      branch: main
  register: _nanosiem_repo_created
  no_log: true
  when: _nanosiem_repos.json.repositories | selectattr('slug', 'equalto', 'nano-rs/parsers') | list | length == 0

- name: Pick the parser repository
  ansible.builtin.set_fact:
    _nanosiem_repo_id: >-
      {{ _nanosiem_repo_created.json.id if _nanosiem_repo_created.json is defined
         else (_nanosiem_repos.json.repositories
               | selectattr('slug', 'equalto', 'nano-rs/parsers') | first).id }}

- name: Sync the parser repository
  ansible.builtin.uri:
    url: "http://localhost/api/parser-repositories/{{ _nanosiem_repo_id }}/sync"
    method: POST
    headers: "{{ _nanosiem_auth }}"
  no_log: true

- name: Wait for parser repository sync
  ansible.builtin.uri:
    url: "http://localhost/api/parser-repositories/{{ _nanosiem_repo_id }}/sync/status"
    headers: "{{ _nanosiem_auth }}"
  register: _nanosiem_sync
  until: _nanosiem_sync.json.status in ['success', 'failed', 'error']
  retries: 40
  delay: 3
  failed_when: _nanosiem_sync.json.status != 'success'
  no_log: true

- name: List the repository parsers
  ansible.builtin.uri:
    url: "http://localhost/api/parser-repositories/{{ _nanosiem_repo_id }}/parsers?limit=1000"
    headers: "{{ _nanosiem_auth }}"
  register: _nanosiem_catalog
  no_log: true

- name: Resolve the requested OCSF parsers
  ansible.builtin.set_fact:
    _nanosiem_wanted: >-
      {{ _nanosiem_catalog.json
         | selectattr('file_path', 'in',
             nanosiem_parsers
             | map('regex_replace', '^(.*)$', 'parsers-ocsf/\1/parser.yaml')
             | list)
         | list }}

- name: Require every requested parser to exist
  ansible.builtin.assert:
    that:
      - _nanosiem_wanted | length == nanosiem_parsers | length
    fail_msg: >-
      nano-rs/parsers has no parsers-ocsf/<name>/parser.yaml for some of
      {{ nanosiem_parsers }} (found
      {{ _nanosiem_wanted | map(attribute='file_path') | list }}).
    quiet: true

- name: Import parsers not imported yet
  ansible.builtin.uri:
    url: "http://localhost/api/parser-repositories/{{ _nanosiem_repo_id }}/parsers/import/{{ item.file_path | urlencode | replace('/', '%2F') }}"
    method: POST
    headers: "{{ _nanosiem_auth }}"
    body_format: json
    body:
      import_type: linked
      source_type: "{{ item.file_path.split('/')[1] }}"
  loop: "{{ _nanosiem_wanted | rejectattr('is_imported') | list }}"
  loop_control:
    label: "{{ item.file_path }}"
  register: _nanosiem_imported

- name: Collect parser log source ids
  ansible.builtin.set_fact:
    _nanosiem_log_sources: >-
      {{ (_nanosiem_wanted | selectattr('is_imported')
          | map(attribute='linked_log_source_id') | list)
         + (_nanosiem_imported.results | default([])
            | map(attribute='json') | map(attribute='log_source_id') | list) }}

- name: Read parser log sources
  ansible.builtin.uri:
    url: "http://localhost/api/log-sources/{{ item }}"
    headers: "{{ _nanosiem_auth }}"
  loop: "{{ _nanosiem_log_sources }}"
  register: _nanosiem_log_source_results
  no_log: true

- name: Deploy parser log sources not live yet
  ansible.builtin.uri:
    url: "http://localhost/api/log-sources/{{ item.json.id }}/deploy"
    method: POST
    headers: "{{ _nanosiem_auth }}"
    timeout: 120
  loop: "{{ _nanosiem_log_source_results.results | rejectattr('json.deployed') | list }}"
  loop_control:
    label: "{{ item.json.name }}"
  changed_when: true
