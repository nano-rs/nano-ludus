---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - docker-compose-plugin
      - curl
      - ca-certificates
    state: present
    update_cache: true

- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ nanosiem_deploy_dir }}"
    state: directory
    mode: "0755"

# ---- Open-core stack: fetched from nano-rs/nano (single source of truth) ----
# NAN-1267: the lab does NOT vendor or fork the stack. It deploys exactly what
# open-core ships — the opensource compose + its vector/nginx/clickhouse config,
# pulled from the public repo at deploy time — so it inherits every upstream fix
# (e.g. the vector api.playground removal, NAN-1260) and the third-party @sha256
# pins in images.lock (NAN-1258) automatically, with nothing to maintain here.
- name: Fetch open-core artifacts from nano-rs/nano ({{ nano_ref }})
  ansible.builtin.shell:
    cmd: >
      set -o pipefail &&
      curl -fsSL "https://github.com/nano-rs/nano/archive/refs/heads/{{ nano_ref }}.tar.gz"
      | tar -xz -C "{{ nanosiem_deploy_dir }}" --strip-components=1
      "nano-{{ nano_ref }}/docker-compose.opensource.yml"
      "nano-{{ nano_ref }}/images.lock"
      "nano-{{ nano_ref }}/config/vector"
      "nano-{{ nano_ref }}/config/nginx/nginx.opensource.conf"
      "nano-{{ nano_ref }}/clickhouse/config.d"
      "nano-{{ nano_ref }}/clickhouse/users.d"
    executable: /bin/bash
  register: nanosiem_fetch
  changed_when: true
  retries: 5
  delay: 15
  until: nanosiem_fetch.rc == 0

- name: Promote opensource compose to docker-compose.yml
  ansible.builtin.command:
    cmd: mv -f "{{ nanosiem_deploy_dir }}/docker-compose.opensource.yml" "{{ nanosiem_deploy_dir }}/docker-compose.yml"
  changed_when: true

# The ONLY deviation from the upstream compose: docker.dragonflydb.io intermittently
# times out from inside the lab; the GHCR mirror is reliable (NAN-1217). Pure
# network workaround — not a feature change.
- name: Adapt dragonfly image to the GHCR mirror (NAN-1217)
  ansible.builtin.replace:
    path: "{{ nanosiem_deploy_dir }}/docker-compose.yml"
    regexp: '^(\s*image:\s*)docker\.dragonflydb\.io/dragonflydb/dragonfly:.*$'
    replace: '\1ghcr.io/dragonflydb/dragonfly:latest'
  notify: restart nanosiem

- name: Create vector dynamic mountpoint
  ansible.builtin.file:
    # Mountpoint for the nano-vector-dynamic volume. The vector container binds
    # config/vector at /etc/vector READ-ONLY, so Docker can't create
    # /etc/vector/dynamic itself (NAN-1218). The api delivers parser configs here.
    path: "{{ nanosiem_deploy_dir }}/config/vector/dynamic"
    state: directory
    mode: "0755"

# ---- Secrets (generated on the target, persisted across re-deploys) ----
# The control node's $HOME is read-only on Ludus, so secrets can't live there.
# Generate them on the SIEM box and keep them in {{ deploy }}/.secrets so a
# re-deploy reuses the same JWT/encryption key (rotating them would orphan
# secret-at-rest data and log everyone out). Skipped if values are pinned in
# role_vars.
- name: Create secrets directory
  ansible.builtin.file:
    path: "{{ nanosiem_deploy_dir }}/.secrets"
    state: directory
    mode: "0700"
  when: nanosiem_jwt_secret | length == 0 or nanosiem_encryption_key | length == 0

- name: Generate persistent secrets on first run
  ansible.builtin.shell: "umask 077 && openssl rand -hex 32 > {{ nanosiem_deploy_dir }}/.secrets/{{ item }}"
  args:
    creates: "{{ nanosiem_deploy_dir }}/.secrets/{{ item }}"
  loop:
    - jwt_secret
    - encryption_key
  when: nanosiem_jwt_secret | length == 0 or nanosiem_encryption_key | length == 0

- name: Read generated JWT secret
  ansible.builtin.slurp:
    src: "{{ nanosiem_deploy_dir }}/.secrets/jwt_secret"
  register: nanosiem_jwt_secret_file
  when: nanosiem_jwt_secret | length == 0

- name: Read generated encryption key
  ansible.builtin.slurp:
    src: "{{ nanosiem_deploy_dir }}/.secrets/encryption_key"
  register: nanosiem_encryption_key_file
  when: nanosiem_encryption_key | length == 0

- name: Adopt generated secrets
  ansible.builtin.set_fact:
    nanosiem_jwt_secret: "{{ (nanosiem_jwt_secret_file.content | b64decode | trim) if nanosiem_jwt_secret | length == 0 else nanosiem_jwt_secret }}"
    nanosiem_encryption_key: "{{ (nanosiem_encryption_key_file.content | b64decode | trim) if nanosiem_encryption_key | length == 0 else nanosiem_encryption_key }}"

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nanosiem_deploy_dir }}/.env"
    mode: "0600"
  notify: restart nanosiem

# ---- Firewall (the ports the upstream compose publishes) ----
- name: Allow nano SIEM ports through the firewall
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto | default('tcp') }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    comment: "nano SIEM {{ item.name }}"
  loop:
    - { port: "{{ nanosiem_http_port }}", name: "Web/API (nginx)" }
    - { port: "{{ nanosiem_vector_http_port }}", name: "Vector HTTP ingest" }
    - { port: "6000", name: "Vector native protocol" }
    - { port: "{{ nanosiem_vector_hec_port }}", name: "Splunk HEC" }
    - { port: "4317", name: "OTel gRPC" }
    - { port: "4318", name: "OTel HTTP" }
    - { port: "24224", name: "Fluent Forward" }

# ---- Start the stack ----
- name: Pull container images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ nanosiem_deploy_dir }}"
  # Pull images one at a time. The lab DNS forwarder resolves fine at idle but a
  # fully-parallel pull fires ~40 simultaneous CDN lookups and overwhelms it;
  # serializing keeps it to a few at a time (NAN-1230).
  environment:
    COMPOSE_PARALLEL_LIMIT: "1"
  register: nanosiem_pull
  changed_when: true
  # Retry if the resolver still hiccups mid-pull (NAN-1224).
  retries: 5
  delay: 15
  until: nanosiem_pull.rc == 0

# Supply-chain advisory: confirm the first-party images we pulled match the
# @sha256 digests in the fetched images.lock (NAN-1258). Non-fatal — images.lock
# tracks the latest release, so a freshly-pushed :latest can briefly differ.
# Third-party images are digest-pinned directly in the compose (docker enforces
# those at pull), so only the ghcr.io/nano-rs/* tags are checked here.
- name: Verify first-party image digests against images.lock (advisory)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      mismatch=0
      while read -r repo expected; do
        [ -z "$repo" ] && continue
        case "$repo" in
          \#*) continue ;;
          ghcr.io/nano-rs/*) ;;
          *) continue ;;
        esac
        actual=$(docker image inspect "${repo}:{{ nanosiem_version }}" \
          --format '{% raw %}{{range .RepoDigests}}{{println .}}{{end}}{% endraw %}' 2>/dev/null \
          | grep -F "${repo}@" | head -1)
        if [ "${actual##*@}" != "$expected" ]; then
          echo "DIGEST MISMATCH ${repo}: lock=${expected} pulled=${actual##*@}"
          mismatch=1
        fi
      done < "{{ nanosiem_deploy_dir }}/images.lock"
      if [ "$mismatch" -eq 0 ]; then
        echo "OK: first-party image digests match images.lock"
      else
        echo "NOTE: digest(s) differ — images.lock tracks the latest release"
      fi
    executable: /bin/bash
  register: nanosiem_digest_check
  changed_when: false
  failed_when: false

- name: Show image digest verification result
  ansible.builtin.debug:
    msg: "{{ nanosiem_digest_check.stdout_lines }}"

- name: Start nano SIEM stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ nanosiem_deploy_dir }}"
  changed_when: true

- name: Wait for API to be healthy (through nginx — first run includes DB migrations)
  ansible.builtin.uri:
    url: "http://localhost:{{ nanosiem_http_port }}/api/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 60
  delay: 5
  until: health_check.status == 200

- name: Print access info
  ansible.builtin.debug:
    msg: |
      ============================================
      nano SIEM is running!
      ============================================
      Web UI / API:  {{ nanosiem_base_url }}  (first visit redirects to /setup)

      Log ingestion (Authorization: Bearer {{ nanosiem_vector_auth_token }}):
        HTTP:    {{ nanosiem_base_url }}/ingest  (or  http://{{ nanosiem_siem_ip }}:{{ nanosiem_vector_http_port }})
        HEC:     http://{{ nanosiem_siem_ip }}:{{ nanosiem_vector_hec_port }}
        Vector:  {{ nanosiem_siem_ip }}:6000  (Vector native protocol — aggregators forward here)
      ============================================
