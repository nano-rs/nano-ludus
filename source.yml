# source.yml: repo-level metadata. The whole file is optional.
# When absent, Ludus derives name from the URL and homepage from the git remote.

manifest_version: 1                                # required: schema version, leave as 1
name: "nano SIEM"                                  # optional: display name in `ludus source list`
description: "Active Directory lab with Windows Sysmon/EventLog collection shipped via Vector agent to a Vector aggregator and into the nano open-core SIEM stack (ClickHouse + Postgres), plus an optional Conduit MITM proxy."
authors:                                           # optional: applies to every blueprint in this source
  - "nano-rs <https://nano.rs>"
homepage: https://github.com/nano-rs/nano-ludus   # optional: falls back to the git URL
license: Apache-2.0                                # optional: SPDX identifier
