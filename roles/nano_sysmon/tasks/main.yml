---
# NAN-1527: the Ansible "Add-CSharpType DLL vanished" failures on these boxes were
# NOT a stock-template quirk — they were self-inflicted by this role's own Sysmon
# config, whose FileBlockExecutable rule *deleted* every executable dropped under
# \AppData\Local\Temp\ (where .NET's CodeDom compiles). Root-caused live via Sysmon
# FileDelete (id 23) telemetry. Fix is in files/sysmonconfig.xml (block rule removed);
# no TEMP redirect or other workaround is needed here.
- name: Create Sysmon install directory
  ansible.windows.win_file:
    path: "{{ sysmon_install_dir }}"
    state: directory

- name: Download Sysmon zip
  ansible.windows.win_get_url:
    url: "{{ sysmon_download_url }}"
    dest: "{{ sysmon_install_dir }}\\Sysmon.zip"
    force: false
    # Bypass the Conduit MITM proxy for this download (NAN-1527). On a re-deploy the
    # proxy + its CA are already active (set by nano_vector_agent on the prior run),
    # so even the `force: false` freshness-check connection gets MITM'd and fails the
    # TLS trust check ("Could not establish trust relationship"). The Sysmon binary
    # doesn't need to be proxy-visible — go direct so fresh + re-deploys behave the same.
    use_proxy: false
  register: sysmon_download
  retries: 3
  delay: 10
  until: sysmon_download is succeeded

- name: Extract Sysmon zip
  community.windows.win_unzip:
    src: "{{ sysmon_install_dir }}\\Sysmon.zip"
    dest: "{{ sysmon_install_dir }}"
    creates: "{{ sysmon_install_dir }}\\{{ sysmon_exe }}"

- name: Copy Sysmon config
  ansible.windows.win_copy:
    src: sysmonconfig.xml
    dest: "{{ sysmon_install_dir }}\\sysmonconfig.xml"

- name: Check if Sysmon service exists
  ansible.windows.win_command:
    cmd: 'sc query Sysmon64'
  register: sysmon_service
  failed_when: false
  changed_when: false

- name: Install Sysmon (first time)
  ansible.windows.win_command:
    cmd: '"{{ sysmon_install_dir }}\{{ sysmon_exe }}" -accepteula -i "{{ sysmon_install_dir }}\sysmonconfig.xml"'
  when: sysmon_service.rc != 0
  register: sysmon_install
  failed_when: sysmon_install.rc != 0

- name: Update Sysmon config (if already installed)
  ansible.windows.win_command:
    cmd: '"{{ sysmon_install_dir }}\{{ sysmon_exe }}" -c "{{ sysmon_install_dir }}\sysmonconfig.xml"'
  when: sysmon_service.rc == 0
  register: sysmon_update
  changed_when: true

- name: Print Sysmon status
  ansible.builtin.debug:
    msg: |
      Sysmon installed with -i flag (auto-starts service).
      Config: {{ sysmon_install_dir }}\sysmonconfig.xml
      Channel: Microsoft-Windows-Sysmon/Operational
