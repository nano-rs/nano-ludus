---
# ansible-playbook --syntax-check target: every vendored role, as the
# blueprint applies them (tests/check.sh).
- name: SIEM box (v2 open core)
  hosts: localhost
  gather_facts: false
  roles:
    - nano_stack

- name: Proxy box
  hosts: localhost
  gather_facts: false
  roles:
    - nano_vector_aggregator
    - nano_conduit_proxy

- name: Windows endpoints
  hosts: localhost
  gather_facts: false
  roles:
    - nano_sysmon
    - nano_vector_agent
