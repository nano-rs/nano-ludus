# nano SIEM Lab Blueprint for Ludus
#
# Topology:
#   [Win DC01]  ─┐  event logs ──► Vector agent ──┐
#   [Win SRV01] ─┤  HTTP traffic ──► Conduit ───┤──► [Proxy/Aggregator] ──HEC──► [SIEM: open-core lean]
#   [Win WS01]  ─┘  (MITM + CA trust)          │    (Vector 0.59 + Conduit)     (OCSF 1.9 on RustFS)
#                                                └──► (Debian .10.11)              (Debian .10.10)
#
# NAN-3397 / NAN-3491: the SIEM box runs the open-core LEAN install
# (install.sh, lean profile: one trusted-local lake cell) instead of the
# retired gen1 stacks, and the aggregator
# ships over authenticated HEC. To ship the range to a hosted lean
# tenant instead (or as well), point the aggregator's nano_ingest_url at
# https://<tenant>.ingest.nano.rs and give it that tenant's ingest
# credential(s) - see README "Ship to a lean tenant"; the SIEM VM is then
# optional.
#
# NAN-3841: nano binds every ingest token to exactly one log source (NAN-3806)
# and the token alone decides where an event lands. The aggregator therefore
# ships each log type (windows_event, windows_sysmon, conduit_proxy) with its
# own token, and issues those tokens itself over the SIEM's API once the SIEM
# role has deployed the parsers.
#
# VLAN 10: 10.x.10.0/24 (where x = your Ludus range's second octet)
#
# Usage (this repo is a Ludus Source — see README "Packaging"):
#   1. ludus source add <this repo>            # or `-d .` for a local clone
#   2. ludus blueprint apply nano-rs-nano-ludus/nanosiem
#   3. ludus range deploy
#
# Before deploying:
#   - Build required templates: debian-12, win2022-server, win11-22h2-enterprise
#
# Role names below carry the `NanoSIEM.` prefix (NAN-2358). The five nano_*
# roles are vendored under `ansible/roles/`, and every one of them declares
# `author: NanoSIEM` in its meta/main.yml — so ansible-galaxy installs them as
# `NanoSIEM.<role_name>`, not under the bare directory name. Referencing them
# bare here makes `ludus range deploy` fail to resolve the roles, which is what
# an external tester hit: the range would not deploy until every entry was
# hand-prefixed. `geerlingguy.docker` was already namespaced, which is why it
# was the only one that resolved.
#
# If you rename a role or drop its `author`, update BOTH sides or this breaks
# again silently.
#
# Lab admin password: random per range, never in this file. The SIEM's
# nano_lean role generates it once and keeps it on the Ludus controller
# (~/.nano-ludus/<range_id>/lab-admin-password, 0600) and on the SIEM
# (/root/.nano-lab-admin, 0600). The aggregator reads the controller copy to log
# in and issue one ingest token per source. To override, set
# nano_lean_admin_password and nano_api_password from a vault, or give the
# aggregator an admin API key (nano_api_key).

ludus:
  # =========================================================================
  # SIEM Box - open-core nano lean (install.sh, lean profile): API, search,
  # jobs, web, Vector 0.59 ingest, one lake cell, OCSF 1.9 on RustFS
  # =========================================================================
  - vm_name: "{{ range_id }}-nanosiem"
    hostname: "{{ range_id }}-SIEM"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 16
    cpus: 8
    linux: true
    roles:
      - geerlingguy.docker
      - NanoSIEM.nano_lean
    role_vars:
      docker_users:
        - localuser
      # Current lean source; images pinned to the published open-core release.
      # nano_lean_repo_url: "https://github.com/nano-rs/nano.git"
      # nano_lean_ref: "main"
      # nano_lean_version: "1.0.6"
      #
      # --- Lab defaults ---
      # The admin password is generated per range (see the header); no
      # nano_lean_admin_password here.
      # The install token (VECTOR_AUTH_TOKEN) is no longer used by the range:
      # the aggregator ships with one token per source. Pin it only for other
      # senders of your own.
      # nano_lean_ingest_token: "<24+ base64url characters>"
      nano_lean_parsers:
        - windows_event
        - windows_sysmon
        - conduit_proxy

  # =========================================================================
  # Proxy / Aggregator - Vector aggregator (the range's shipper) + Conduit
  # =========================================================================
  - vm_name: "{{ range_id }}-proxy"
    hostname: "{{ range_id }}-PROXY"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 8
    cpus: 4
    linux: true
    roles:
      - geerlingguy.docker
      # Runs after the SIEM's install and parser deploy: it issues the
      # per-source ingest tokens over the SIEM's API (Ludus 2 depends_on).
      - name: NanoSIEM.nano_vector_aggregator
        depends_on:
          - vm_name: "{{ range_id }}-nanosiem"
            role: NanoSIEM.nano_lean
      - NanoSIEM.nano_conduit_proxy
    role_vars:
      docker_users:
        - localuser
      # Ship to the SIEM box above (last octet 10) over HEC :8088, one token
      # per source. The role issues them over http://<siem>/api, logged in as
      # the lab admin (admin@lab.local) with the range's generated password.
      nano_ingest_mode: hec
      nanosiem_siem_ip: "10.{{ range_second_octet }}.10.10"
      #
      # Lean tenant instead: drop nanosiem_siem_ip, and set
      # nano_ingest_url: "https://<tenant>.ingest.nano.rs"
      # nano_ingest_source_tokens:                         # one credential per source
      #   windows_event: "<credential>"
      #   windows_sysmon: "<credential>"
      #   conduit_proxy: "<credential>"
      # Conduit proxy — pulls from ghcr.io/the2dl/conduit-{proxy,api}:latest

  # =========================================================================
  # Domain Controller - Primary DC for lab.local
  # =========================================================================
  - vm_name: "{{ range_id }}-dc01"
    hostname: "{{ range_id }}-DC01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: true
    domain:
      fqdn: lab.local
      role: primary-dc
    roles:
      - NanoSIEM.nano_sysmon
      - NanoSIEM.nano_vector_agent
    role_vars:
      # Points to the aggregator/proxy box (last octet 11)
      vector_aggregator_ip: "10.{{ range_second_octet }}.10.11"
      vector_aggregator_port: 9000
      vector_eventlog_channels:
        - "Application"
        - "System"
        - "Security"
        - "Microsoft-Windows-Sysmon/Operational"
        - "Microsoft-Windows-PowerShell/Operational"
        - "Microsoft-Windows-Windows Defender/Operational"
        - "Directory Service"
        - "DNS Server"
      # Conduit MITM proxy
      conduit_proxy_enabled: true
      conduit_proxy_ip: "10.{{ range_second_octet }}.10.11"

  # =========================================================================
  # Member Server - General purpose Windows Server
  # =========================================================================
  - vm_name: "{{ range_id }}-srv01"
    hostname: "{{ range_id }}-SRV01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: lab.local
      role: member
    roles:
      - NanoSIEM.nano_sysmon
      - NanoSIEM.nano_vector_agent
    role_vars:
      vector_aggregator_ip: "10.{{ range_second_octet }}.10.11"
      vector_aggregator_port: 9000
      conduit_proxy_enabled: true
      conduit_proxy_ip: "10.{{ range_second_octet }}.10.11"

  # =========================================================================
  # Windows Workstation - End-user machine
  # =========================================================================
  - vm_name: "{{ range_id }}-ws01"
    hostname: "{{ range_id }}-WS01"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 30
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: lab.local
      role: member
    roles:
      - NanoSIEM.nano_sysmon
      - NanoSIEM.nano_vector_agent
    role_vars:
      vector_aggregator_ip: "10.{{ range_second_octet }}.10.11"
      vector_aggregator_port: 9000
      conduit_proxy_enabled: true
      conduit_proxy_ip: "10.{{ range_second_octet }}.10.11"
