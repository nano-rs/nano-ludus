# blueprint.yml: display metadata for one blueprint.

manifest_version: 1                                                          # required: schema version, leave as 1
id: nanosiem                                                                 # required: unique within this source; lowercase, dashes
name: "nano SIEM"                                                            # required: display name
description: "AD domain with Windows Sysmon/EventLog collection via Vector into the nano open-core SIEM stack, plus an optional Conduit MITM proxy." # required
version: 0.1.0                                                               # required: your semver; bump on every release
config: range-config.yml                                                    # required: path to the range config, relative to this file

tags: [siem, ad, vector, sysmon]                                            # optional: filter via `ludus blueprint list --tag <tag>`
# thumbnail_path: thumbnail.png                                             # optional: relative path
# min_ludus_version: 2.1.2                                                  # optional: hard install gate
