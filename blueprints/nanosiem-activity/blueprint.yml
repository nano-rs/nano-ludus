# blueprint.yml: display metadata for one blueprint.

manifest_version: 1                                                          # required: schema version, leave as 1
id: nanosiem-activity                                                               # required: unique within this source; lowercase, dashes
name: "nano SIEM with activity"                                                            # required: display name
description: "The nano SIEM lab plus simulated activity: BadBlood AD users, GHOSTS browsing, commands and Office documents. AD domain with Windows Sysmon/EventLog collection via Vector 0.62 into nano v2 open core (OCSF on ClickHouse), plus an optional Conduit MITM proxy." # required
version: 0.4.0                                                               # required: your semver; bump on every release
config: range-config.yml                                                    # required: path to the range config, relative to this file

tags: [siem, ad, vector, sysmon, ocsf, clickhouse, ghosts, badblood]                          # optional: filter via `ludus blueprint list --tag <tag>`
thumbnail_path: thumbnail.png                                               # optional: relative path
# min_ludus_version: 2.1.2                                                  # optional: hard install gate
